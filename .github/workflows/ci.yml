name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release
      - name: Perft suites
        run: |
          cargo run --release -p perft -- suite crates/perft/suites/standard.epd
          cargo run --release -p perft -- suite crates/perft/suites/extended.epd

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Miri (engine-core)
        run: cargo +nightly miri test -p bear-core
